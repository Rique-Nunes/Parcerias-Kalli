server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Oculta a versao do Nginx nos cabecalhos
    server_tokens off;

    # Compressao Gzip para carregamento rapido
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self';" always;

    # 1. Bloqueia acesso a arquivos e pastas ocultas (.env, .git, .vscode, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. Bloqueia tentativas de scan de arquivos sensiveis e scripts
    location ~* \.(?:env|sql|bak|backup|zip|tar|tar\.gz|tgz|log|ini|conf|ya?ml|key|pem|php|asp|aspx|jsp|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Bloqueia caminhos conhecidos de varredura (WordPress, actuator, etc.)
    location ~* ^/(?:wp-|actuator|_vti_pvt|phpinfo|dump) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # HTML revalidado para nao reter versoes antigas
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self';" always;
    }

    # Rotas estaticas normais: se o arquivo nao existe, devolve 404 (evita responder 200 com index.html para scanners)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # CSS e JS sempre revalidados
    location ~* \.(?:css|js)$ {
        access_log off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Imagens em cache por 7 dias
    location ~* \.(?:ico|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
